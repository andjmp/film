<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Film Roll</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; width:100vw; height:100vh; font-family:'Courier New',monospace; }

/* Scroll container */
#reel-wrap {
  position:absolute; inset:0;
  overflow-x:auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#reel-wrap::-webkit-scrollbar { display:none; }
#reel { display:flex; background:#000; }

/* Counter */
#counter {
  position:fixed; top:12px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.65); color:#f0e6c8;
  padding:4px 14px; border-radius:20px;
  font-size:13px; letter-spacing:2px; z-index:200; pointer-events:none;
}

/* Lightbox */
#lightbox {
  display:none; position:fixed; inset:0; z-index:500;
  background:#000;
  align-items:center; justify-content:center;
}
#lightbox.open { display:flex; }
#lb-close { position:fixed; top:16px; right:20px; color:#f0e6c8; font-size:26px; cursor:pointer; background:none; border:none; opacity:0.7; z-index:510; }
#lb-close:hover { opacity:1; }
#lb-counter { position:fixed; top:12px; left:50%; transform:translateX(-50%); color:#888; font-size:12px; letter-spacing:2px; z-index:510; background:rgba(0,0,0,0.5); padding:4px 12px; border-radius:20px; }
#lb-img { max-width:100vw; max-height:100vh; object-fit:contain; display:block; }
#lb-title { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); color:rgba(240,230,180,0.7); font-size:13px; letter-spacing:2px; z-index:510; pointer-events:none; white-space:nowrap; }
#lb-tap-left, #lb-tap-right { position:fixed; top:0; width:30%; height:100%; z-index:505; cursor:pointer; }
#lb-tap-left { left:0; } #lb-tap-right { right:0; }
#lb-nav { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:28px; z-index:510; }
#lb-prev, #lb-next {
  background:rgba(240,230,180,0.1); color:#f0e6c8;
  border:1px solid rgba(240,230,180,0.3); border-radius:50%;
  width:38px; height:38px; font-size:20px; line-height:1;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; padding-bottom:1px;
}
#lb-prev:hover, #lb-next:hover { background:rgba(240,230,180,0.25); }
</style>
</head>
<body>

<div id="counter">1 / —</div>
<div id="reel-wrap"><div id="reel"></div></div>

<div id="lightbox">
  <button id="lb-close">✕</button>
  <div id="lb-counter"></div>
  <img id="lb-img" src="" alt="">
  <div id="lb-tap-left"></div>
  <div id="lb-tap-right"></div>
  <div id="lb-nav">
    <button id="lb-prev">‹</button>
    <button id="lb-next">›</button>
  </div>
  <div id="lb-title"></div>
</div>

<script>
// ============================================================
// DATA — edit this for your roll
// strip/  — film strip thumbnails (rotated scans)
// full/   — full lightbox images (pre-edited, correct orientation)
// ============================================================
const roll = {
  title: 'Ilford HP5',
  frames: Array.from({length: 10}, (_, i) => ({
    full: `full/${i}.jpg`,
    title: ''
  }))
};
// ============================================================

let lbIndex = 0;

// ── Build reel ──
function buildReel() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const land = vw > vh;
  const stripFolder = land ? 'strip-landscape' : 'strip-portrait';
  const reel = document.getElementById('reel');
  reel.innerHTML = '';

  if (land) {
    const fixedH = vh;
    reel.style.cssText = `display:flex; flex-direction:row; height:${vh}px; width:max-content;`;
    roll.frames.forEach((fr, i) => {
      const f = mkFrame(i);
      reel.appendChild(f);
      loadCanvas(f, `${stripFolder}/${i}.jpg`, fixedH, true);
    });
  } else {
    const fixedW = vw;
    reel.style.cssText = `flex-direction:column;height:max-content;width:${vw}px;`;
    const fcol = document.createElement('div'); fcol.className = 'f-col'; fcol.style.width = fixedW + 'px';
    roll.frames.forEach((fr, i) => { const f = mkFrame(i); fcol.appendChild(f); loadCanvas(f, `${stripFolder}/${i}.jpg`, fixedW, false); });
    reel.appendChild(fcol);
  }
  updateCounter();
}

function mkSpH(n) {
  const row = document.createElement('div'); row.className = 'sp-row';
  for (let i = 0; i < n; i++) { const h = document.createElement('div'); h.className = 'sp-h'; row.appendChild(h); }
  return row;
}

function mkFrame(i) {
  const frame = document.createElement('div');
  frame.className = 'frame'; frame.dataset.index = i;
  const cv = document.createElement('canvas'); frame.appendChild(cv);
  frame.addEventListener('click', () => openLightbox(i));
  return frame;
}

function loadCanvas(frameEl, src, fixedDim, isLand) {
  const img = new Image();
  img.onload = () => {
    const nat = img.naturalWidth / img.naturalHeight;
    const w = isLand ? Math.round(fixedDim * nat) : fixedDim;
    const h = isLand ? fixedDim : Math.round(fixedDim / nat);
    frameEl.style.width = w+'px'; frameEl.style.height = h+'px';
    const cv = frameEl.querySelector('canvas');
    cv.width=w; cv.height=h; cv.style.width=w+'px'; cv.style.height=h+'px';
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
  };
  img.src = src;
}

function updateCounter() {
  const land = window.innerWidth > window.innerHeight;
  const frames = document.querySelectorAll('.frame');
  if (!frames.length) return;
  let closest = 0, minDist = Infinity;
  frames.forEach((f, i) => {
    const r = f.getBoundingClientRect();
    const dist = land ? Math.abs(r.left+r.width/2-window.innerWidth/2) : Math.abs(r.top+r.height/2-window.innerHeight/2);
    if (dist < minDist) { minDist = dist; closest = i; }
  });
  document.getElementById('counter').textContent = `${closest} / ${roll.frames.length - 1}`;
}
document.getElementById('reel-wrap').addEventListener('scroll', updateCounter);
window.addEventListener('resize', buildReel);

// ── Lightbox ──
function openLightbox(i) { lbIndex = i; renderLightbox(); document.getElementById('lightbox').classList.add('open'); }
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  // Scroll the active frame back into view
  const frame = document.querySelectorAll('.frame')[lbIndex];
  if (frame) frame.scrollIntoView({ behavior: 'instant', block: 'center', inline: 'center' });
}

function renderLightbox() {
  const { full, title } = roll.frames[lbIndex];
  document.getElementById('lb-img').src = full;
  document.getElementById('lb-counter').textContent = `${lbIndex} / ${roll.frames.length - 1}`;
  document.getElementById('lb-title').textContent = title || '';
}

function prev() { lbIndex = (lbIndex - 1 + roll.frames.length) % roll.frames.length; renderLightbox(); }
function next() { lbIndex = (lbIndex + 1) % roll.frames.length; renderLightbox(); }

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', prev);
document.getElementById('lb-next').addEventListener('click', next);
document.getElementById('lb-tap-left').addEventListener('click', prev);
document.getElementById('lb-tap-right').addEventListener('click', next);
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prev();
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
});

buildReel();
</script>
</body>
</html>
